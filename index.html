<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome To NASRIN SOUN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #000;
      width: 100%;
      min-height: 100%;
    }

    .website {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    .website img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Transparent clickable areas over the buttons */
    .link {
      position: absolute;
      left: 9.55%;
      width: 78.8%;
      height: 6.75%;
      display: block;
      z-index: 10;
      border-radius: 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .community { top: 46.75%; }
    .telegram  { top: 54.20%; }
    .signal    { top: 61.65%; }
    .learning  { top: 69.10%; }
    .facebook  { top: 76.55%; }
    .youtube   { top: 84.00%; }

    /* Small visual feedback when the user touches a button */
    .link:active {
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body>

  <main class="website">

    <!-- Main image -->
    <img src="website.png" alt="Welcome To NASRIN SOUN">

    <!-- 1. Community -->
    <a
      class="link community"
      href="https://t.me/journeywitme"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Community">
    </a>

    <!-- 2. Telegram -->
    <a
      class="link telegram"
      href="https://t.me/Nasrin_Suon"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Telegram">
    </a>

    <!-- 3. Signal -->
    <a
      class="link signal"
      href="https://t.me/Learning_Forex_Nasrin"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Signal">
    </a>

    <!-- 4. Learning Forex -->
    <a
      class="link learning"
      href="https://t.me/open_acc026"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Learning Forex">
    </a>

    <!-- 5. Facebook Page -->
    <a
      class="link facebook"
      href="https://www.facebook.com/profile.php?id=61587144250978"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook Page">
    </a>

    <!-- 6. YouTube -->
    <a
      class="link youtube"
      href="https://www.youtube.com/@nasrinsoun4532"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="YouTube">
    </a>

  </main>

</body>
</html>
