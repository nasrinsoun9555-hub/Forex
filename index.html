<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome To NASRIN SOUN</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .website {
            width: 100%;
            max-width: 900px;
        }

        /* Main Image */
        .main-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .main-image:hover {
            transform: scale(1.01);
            opacity: 0.95;
        }

        /* Link buttons */
        .links {
            margin-top: 20px;
            display: grid;
            gap: 12px;
        }

        .link-btn {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 16px 20px;
            border: 1px solid #d6a84f;
            border-radius: 12px;
            color: white;
            background: linear-gradient(
                135deg,
                #171717,
                #29200f
            );
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .link-btn:hover {
            background: #d6a84f;
            color: #111;
            transform: translateY(-2px);
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 8px;
            }

            .main-image {
                border-radius: 8px;
            }

            .link-btn {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="website">

    -->

            src="website.png"
